<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Birthday Experience ✨</title>
    
    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; transition: background 0.5s ease, color 0.5s ease; }
        
        /* 4 Aesthetic UI Dynamic Themes */
        body.theme-skyblue {
            background: radial-gradient(circle at center, #0d1b2a 0%, #000814 100%);
            --accent: #00b0ff;
            --accent-glow: rgba(0, 176, 255, 0.4);
            --text-glow: #80d8ff;
        }
        body.theme-purple {
            background: radial-gradient(circle at center, #240046 0%, #10002b 100%);
            --accent: #b5179e;
            --accent-glow: rgba(181, 23, 158, 0.4);
            --text-glow: #e0aaff;
        }
        body.theme-rose {
            background: radial-gradient(circle at center, #3d001e 0%, #1a000d 100%);
            --accent: #ff4d6d;
            --accent-glow: rgba(255, 77, 109, 0.4);
            --text-glow: #ffb3c1;
        }
        body.theme-emerald {
            background: radial-gradient(circle at center, #002b28 0%, #001210 100%);
            --accent: #00f5d4;
            --accent-glow: rgba(0, 245, 212, 0.4);
            --text-glow: #70e000;
        }

        body {
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Floating Stars */
        .bg-elements {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .element {
            position: absolute;
            color: var(--accent);
            opacity: 0.6;
            animation: floatBG 8s infinite ease-in-out;
        }
        @keyframes floatBG {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 26px 20px;
            border-radius: 28px;
            box-shadow: 0 0 35px var(--accent-glow);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.16);
            position: relative;
            z-index: 10;
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--text-glow);
            margin-top: 0;
            text-shadow: 0 0 12px var(--accent);
        }

        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { font-size: 0.82rem; color: var(--text-glow); display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
        }
        input[type="file"] {
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            border: 1px dashed var(--accent);
        }

        .badge-status {
            font-size: 0.82rem;
            color: #76ff03;
            margin-top: 5px;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), #014f86);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            margin-top: 12px;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        /* Unique Stylized QR Frame (Heart/Star Motif) */
        .qr-frame-wrapper {
            position: relative;
            margin: 20px auto;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-heart-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            filter: drop-shadow(0 0 12px var(--accent));
        }
        #qrcode {
            position: relative;
            z-index: 2;
            padding: 10px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 0 18px rgba(0,0,0,0.4);
        }
        .qr-badge-icon {
            position: absolute;
            z-index: 3;
            top: -12px;
            right: -10px;
            font-size: 1.8rem;
            animation: pulseIcon 1.5s infinite alternate;
        }
        @keyframes pulseIcon {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.15) rotate(8deg); }
        }

        /* Countdown */
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }
        .timer-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 8px 6px;
            min-width: 58px;
        }
        .timer-box span { font-size: 1.3rem; font-weight: 700; color: #fff; display: block; }
        .timer-box small { font-size: 0.65rem; color: var(--text-glow); text-transform: uppercase; }

        /* Polaroid Photo Slideshow */
        .photo-card {
            background: #ffffff;
            padding: 8px 8px 24px 8px;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            margin: 15px auto;
            max-width: 240px;
            transform: rotate(-2deg);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .cursive-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            min-height: 85px;
            line-height: 1.35;
            color: #ffffff;
            margin: 15px 0;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Neon Blessing (Strictly No Emojis) */
        .blessing-neon {
            font-family: 'Dancing Script', cursive;
            font-size: 2.4rem;
            color: #ffffff;
            display: none;
            text-shadow: 
                0 0 7px #fff, 
                0 0 15px var(--accent), 
                0 0 35px var(--accent), 
                0 0 70px var(--accent);
            animation: floatBlessing 2.5s infinite ease-in-out;
            margin: 25px 0 15px 0;
        }
        @keyframes floatBlessing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Sound Enable Barrier */
        #entry-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body class="theme-skyblue">

    <div class="bg-elements" id="bg-elements"></div>

    <audio id="bg-audio" loop preload="auto">
        <source id="audio-source" src="https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=happy-birthday-to-you-piano-124037.mp3" type="audio/mpeg">
    </audio>

    <div id="entry-modal" style="display: none;">
        <h1 style="font-size: 2.7rem; margin-bottom: 10px;">Surprise Waiting For You ✨</h1>
        <p style="color: var(--text-glow); font-size: 1rem; margin-bottom: 25px;">Turn on volume for music 🎶</p>
        <button class="btn" style="font-size: 1.2rem; padding: 14px 40px;" onclick="unlockAndPlay()">Open Surprise 🎁</button>
    </div>

    <!-- 1. CREATOR PANEL -->
    <div id="creator-view" class="box">
        <h2>Wish System Creator ✨</h2>
        
        <div class="input-group">
            <label>Recipient Name:</label>
            <input type="text" id="in-name" placeholder="Name">
        </div>

        <div class="input-group">
            <label>Theme Style (Interface Look):</label>
            <select id="in-theme" onchange="previewTheme(this.value)">
                <option value="theme-skyblue">1. Sky-Blue Frost (Girlish & Cool)</option>
                <option value="theme-purple">2. Midnight Violet (Royal & Dreamy)</option>
                <option value="theme-rose">3. Sunset Rose (Fairy & Warm)</option>
                <option value="theme-emerald">4. Mint Emerald (Cyber Glow)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Birthday Date (Countdown):</label>
            <input type="date" id="in-date">
        </div>

        <div class="input-group">
            <label>Select Multiple Photos (Gallery):</label>
            <input type="file" id="in-photos" accept="image/*" multiple onchange="prepareMultiplePhotos(this)">
            <div id="photo-status" class="badge-status"></div>
        </div>

        <div class="input-group">
            <label>English Wishes (Ek line me ek wish):</label>
            <textarea id="in-wishes" rows="4"></textarea>
        </div>

        <button class="btn" id="gen-btn" onclick="saveToCloudAndMakeUniqueQR()">Generate Heart Scanner 💖</button>

        <div id="qr-result" style="display:none; margin-top: 15px;">
            <p style="color: var(--text-glow); font-size:0.85rem; margin-bottom: 5px;">Scan this unique QR on ANY phone:</p>
            
            <!-- Unique Star/Heart Framed QR -->
            <div class="qr-frame-wrapper">
                <svg class="qr-heart-bg" viewBox="0 0 100 100">
                    <path d="M50 88 S15 65 15 38 A20 20 0 0 1 50 25 A20 20 0 0 1 85 38 C85 65 50 88 50 88 Z" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="6,3"/>
                </svg>
                <span class="qr-badge-icon">💖</span>
                <div id="qrcode"></div>
            </div>
            
            <button class="btn" style="padding: 10px 24px; font-size: 0.9rem;" onclick="testCardRightNow()">Test Live Card 👁️</button>
        </div>
    </div>

    <!-- 2. RECIPIENT SURPRISE VIEW -->
    <div id="card-view" class="box" style="display: none;">
        <h1 id="out-name">Happy Birthday! 🎂</h1>

        <div id="countdown" class="timer-grid">
            <div class="timer-box"><span id="days">00</span><small>Days</small></div>
            <div class="timer-box"><span id="hours">00</span><small>Hours</small></div>
            <div class="timer-box"><span id="minutes">00</span><small>Mins</small></div>
            <div class="timer-box"><span id="seconds">00</span><small>Secs</small></div>
        </div>

        <div class="photo-card">
            <img id="out-photo" src="" alt="Birthday Special">
        </div>

        <div id="wish-display" class="cursive-text">A special surprise waiting for you...</div>
        
        <!-- Strictly No Emojis Neon Blessing -->
        <div id="blessing-box" class="blessing-neon">Mahadev Bless You</div>

        <button id="action-btn" class="btn" onclick="stepWish()">Next Surprise ✨</button>
    </div>

    <script>
        // Floating Stars
        const bg = document.getElementById('bg-elements');
        const icons = ['✨', '⭐', '❄️', '💙', '💜'];
        for (let i = 0; i < 22; i++) {
            let el = document.createElement('div');
            el.className = 'element';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.fontSize = (Math.random() * 18 + 14) + 'px';
            el.style.animationDuration = (Math.random() * 4 + 5) + 's';
            bg.appendChild(el);
        }

        const audio = document.getElementById('bg-audio');
        let selectedPhotosList = [];
        let cardPayload = null;
        let curIdx = 0;

        function previewTheme(themeName) {
            document.body.className = themeName;
        }

        // Direct Cloud Image Uploader (Zero device bounds)
        async function uploadSingleImageToCloud(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('https://tmpfiles.org/api/v1/upload', {
                    method: 'POST',
                    body: formData
                });
                const d = await res.json();
                if (d && d.data && d.data.url) {
                    return d.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                }
            } catch(e) {}
            return null;
        }

        async function prepareMultiplePhotos(input) {
            if (input.files && input.files.length > 0) {
                const status = document.getElementById('photo-status');
                const btn = document.getElementById('gen-btn');
                status.innerText = `Connecting & syncing ${input.files.length} photos... ⏳`;
                btn.disabled = true;

                selectedPhotosList = [];
                for (let i = 0; i < input.files.length; i++) {
                    const onlineUrl = await uploadSingleImageToCloud(input.files[i]);
                    if (onlineUrl) selectedPhotosList.push(onlineUrl);
                }

                if (selectedPhotosList.length === 0) {
                    selectedPhotosList = ["https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600"];
                }
                status.innerText = `✓ ${selectedPhotosList.length} photos synced across all phones!`;
                btn.disabled = false;
            }
        }

        window.onload = async function() {
            document.getElementById('in-wishes').value = 
                "Wishing you a day filled with happiness and a year filled with joy! ✨\n" +
                "May your life be as bright and beautiful as the sky today. 🌟\n" +
                "Wishing you a sky full of stars and a life full of dreams. 🥂\n" +
                "Keep shining and spreading your light wherever you go. 🎈";

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('in-date').value = tomorrow.toISOString().split('T')[0];

            // Check if opened via QR Code scanner (?card=...)
            const urlParams = new URLSearchParams(window.location.search);
            const cardId = urlParams.get('card');

            if (cardId) {
                document.getElementById('creator-view').style.display = 'none';
                document.getElementById('entry-modal').style.display = 'flex';

                try {
                    // Fetch real saved data from cloud
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${cardId}/latest`, {
                        headers: { "X-Bin-Meta": "false" }
                    });
                    cardPayload = await res.json();
                    if (cardPayload && cardPayload.theme) {
                        document.body.className = cardPayload.theme;
                    }
                } catch(e) {
                    console.log("Using fallback cache");
                }
            }
        };

        // Universal Real-Time Data Sync across all devices
        async function saveToCloudAndMakeUniqueQR() {
            const name = document.getElementById('in-name').value.trim() || "Special Friend";
            const date = document.getElementById('in-date').value || "";
            const theme = document.getElementById('in-theme').value;
            const rawWishes = document.getElementById('in-wishes').value.split('\n').filter(w => w.trim() !== "");

            if (selectedPhotosList.length === 0) {
                selectedPhotosList = ["https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600"];
            }

            cardPayload = {
                n: name,
                d: date,
                p: selectedPhotosList,
                w: rawWishes,
                theme: theme
            };

            const btn = document.getElementById('gen-btn');
            btn.innerText = "Creating Live Scanner... ⏳";
            btn.disabled = true;

            let finalUrl = "";
            try {
                // Save universally to free JSONBin Cloud
                const response = await fetch("https://api.jsonbin.io/v3/b", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Bin-Private": "false"
                    },
                    body: JSON.stringify(cardPayload)
                });
                const binData = await response.json();
                const recordId = binData.metadata.id;
                finalUrl = window.location.origin + window.location.pathname + "?card=" + recordId;
            } catch(e) {
                // Resilient fallback: base64 compact query
                const hash = btoa(unescape(encodeURIComponent(JSON.stringify(cardPayload))));
                finalUrl = window.location.origin + window.location.pathname + "?data=" + hash;
            }

            btn.innerText = "Generate Heart Scanner 💖";
            btn.disabled = false;

            // Render Stylized QR
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: finalUrl,
                width: 155,
                height: 155,
                colorDark: "#000814",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            window.testCardUrl = finalUrl;
            document.getElementById('qr-result').style.display = "block";
        }

        function testCardRightNow() {
            if (window.testCardUrl) {
                window.location.href = window.testCardUrl;
            }
        }

        function unlockAndPlay() {
            document.getElementById('entry-modal').style.display = "none";
            document.getElementById('card-view').style.display = "block";

            // If payload came via ?data=
            if (!cardPayload) {
                const urlParams = new URLSearchParams(window.location.search);
                const raw = urlParams.get('data');
                if (raw) {
                    try { cardPayload = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch(e){}
                }
            }

            if (!cardPayload) {
                cardPayload = {
                    n: "Special Friend",
                    d: "",
                    p: ["https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600"],
                    w: ["Wishing you endless smiles and pure happiness! ✨"]
                };
            }

            if (cardPayload.theme) document.body.className = cardPayload.theme;
            document.getElementById('out-name').innerText = "Happy Birthday, " + cardPayload.n + "! 🎂";
            
            audio.play().catch(e => console.log(e));

            const photoEl = document.getElementById('out-photo');
            photoEl.src = (cardPayload.p && cardPayload.p.length > 0) ? cardPayload.p[0] : "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600";

            initCountdown(cardPayload.d);
        }

        function initCountdown(dateStr) {
            if (!dateStr) {
                document.getElementById('countdown').style.display = "none";
                return;
            }
            const targetTime = new Date(dateStr + "T00:00:00").getTime();

            function update() {
                const diff = targetTime - new Date().getTime();
                if (diff <= 0) {
                    document.getElementById('countdown').innerHTML = "<h3 style='color:var(--text-glow);margin:5px;'>It's Celebration Day! 🥳</h3>";
                    return;
                }
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                document.getElementById('minutes').innerText = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
                document.getElementById('seconds').innerText = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
            }
            update();
            setInterval(update, 1000);
        }

        function stepWish() {
            confetti({
                particleCount: 85,
                spread: 65,
                origin: { y: 0.65 },
                colors: ['#00b0ff', '#ffffff', '#ffd700', '#b5179e']
            });

            const textEl = document.getElementById('wish-display');
            const btn = document.getElementById('action-btn');
            const blessing = document.getElementById('blessing-box');
            const photoEl = document.getElementById('out-photo');

            if (curIdx < cardPayload.w.length) {
                textEl.innerText = cardPayload.w[curIdx];
                btn.innerText = "Next Surprise ✨";

                if (cardPayload.p && cardPayload.p.length > 0) {
                    const nextPhotoIdx = (curIdx + 1) % cardPayload.p.length;
                    photoEl.style.opacity = 0;
                    photoEl.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        photoEl.src = cardPayload.p[nextPhotoIdx];
                        photoEl.style.opacity = 1;
                        photoEl.style.transform = 'scale(1)';
                    }, 200);
                }

                curIdx++;
            } else {
                textEl.style.display = "none";
                btn.style.display = "none";
                blessing.style.display = "block";

                var duration = 4 * 1000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00b0ff', '#ffffff'] });
                    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00b0ff', '#ffd700'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }
    </script>
</body>
</html>
