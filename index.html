<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0d1b2a 0%, #000814 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .bg-elements {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .element {
            position: absolute;
            color: rgba(0, 191, 255, 0.35);
            animation: floatBG 8s infinite ease-in-out;
        }
        @keyframes floatBG {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 0 35px rgba(0, 183, 255, 0.25);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: #80d8ff;
            margin-top: 0;
            text-shadow: 0 0 12px rgba(128, 216, 255, 0.7);
        }

        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { font-size: 0.82rem; color: #81d4fa; display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #00b0ff;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
        }
        input[type="file"] {
            padding: 8px;
            background: rgba(0, 176, 255, 0.12);
            cursor: pointer;
            border: 1px dashed #00b0ff;
        }

        .badge-status {
            font-size: 0.82rem;
            color: #76ff03;
            margin-top: 5px;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, #00b0ff, #0081cb);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 176, 255, 0.4);
            margin-top: 12px;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px auto;
            padding: 12px;
            background: #fff;
            border-radius: 16px;
            width: fit-content;
            box-shadow: 0 0 20px rgba(0, 183, 255, 0.4);
        }

        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }
        .timer-box {
            background: rgba(0, 176, 255, 0.18);
            border: 1px solid #00b0ff;
            border-radius: 12px;
            padding: 8px 6px;
            min-width: 58px;
        }
        .timer-box span { font-size: 1.3rem; font-weight: 700; color: #fff; display: block; }
        .timer-box small { font-size: 0.65rem; color: #81d4fa; text-transform: uppercase; }

        .photo-card {
            background: #ffffff;
            padding: 8px 8px 24px 8px;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            margin: 15px auto;
            max-width: 240px;
            transform: rotate(-2deg);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .cursive-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            min-height: 85px;
            line-height: 1.35;
            color: #e0f7fa;
            margin: 15px 0;
        }

        .blessing-neon {
            font-family: 'Dancing Script', cursive;
            font-size: 2.3rem;
            color: #ffffff;
            display: none;
            text-shadow: 
                0 0 7px #fff, 
                0 0 15px #00b0ff, 
                0 0 35px #00b0ff, 
                0 0 70px #00b0ff,
                0 0 90px #0081cb;
            animation: floatBlessing 2.5s infinite ease-in-out;
            margin: 25px 0 15px 0;
        }
        @keyframes floatBlessing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        #entry-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 8, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-elements" id="bg-elements"></div>

    <audio id="bg-audio" loop preload="auto">
        <source id="audio-source" src="https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=happy-birthday-to-you-piano-124037.mp3" type="audio/mpeg">
    </audio>

    <!-- Tap to Open Overlay for Sound Auto-Play -->
    <div id="entry-modal" style="display: none;">
        <h1 style="font-size: 2.6rem; margin-bottom: 10px;">Surprise Waiting For You ✨</h1>
        <p style="color: #81d4fa; font-size: 1rem; margin-bottom: 25px;">Turn on volume for background music 🎶</p>
        <button class="btn" style="font-size: 1.2rem; padding: 14px 40px;" onclick="unlockAndPlay()">Open Surprise 🎁</button>
    </div>

    <!-- 1. CREATOR VIEW -->
    <div id="creator-view" class="box">
        <h2>Wish System Creator ✨</h2>
        
        <div class="input-group">
            <label>Recipient Name:</label>
            <input type="text" id="in-name" placeholder="Friend ka naam">
        </div>

        <div class="input-group">
            <label>Birthday Date (Countdown):</label>
            <input type="date" id="in-date">
        </div>

        <div class="input-group">
            <label>Select Multiple Photos (Choose all at once):</label>
            <input type="file" id="in-photos" accept="image/*" multiple onchange="uploadMultipleImages(this)">
            <div id="photo-status" class="badge-status"></div>
        </div>

        <div class="input-group">
            <label>Select Custom Audio / Song (.mp3):</label>
            <input type="file" id="in-audio" accept="audio/*" onchange="uploadAudio(this)">
            <div id="audio-status" class="badge-status"></div>
        </div>

        <div class="input-group">
            <label>English Wishes (1 per line):</label>
            <textarea id="in-wishes" rows="4"></textarea>
        </div>

        <button class="btn" id="gen-btn" onclick="makeUniversalQR()">Generate QR Scanner 🚀</button>

        <div id="qr-result" style="display:none; margin-top: 18px;">
            <p style="color:#81d4fa; font-size:0.85rem; margin-bottom: 5px;">Scan this QR to open the card on ANY phone:</p>
            <div id="qrcode"></div>
            <button class="btn" style="background:#0288d1; margin-top: 8px;" onclick="testCardLocally()">Test Card Right Now 👁️</button>
        </div>
    </div>

    <!-- 2. RECIPIENT CARD VIEW -->
    <div id="card-view" class="box" style="display: none;">
        <h1 id="out-name">Happy Birthday! 🎂</h1>

        <div id="countdown" class="timer-grid">
            <div class="timer-box"><span id="days">00</span><small>Days</small></div>
            <div class="timer-box"><span id="hours">00</span><small>Hours</small></div>
            <div class="timer-box"><span id="minutes">00</span><small>Mins</small></div>
            <div class="timer-box"><span id="seconds">00</span><small>Secs</small></div>
        </div>

        <div class="photo-card">
            <img id="out-photo" src="" alt="Birthday Special">
        </div>

        <div id="wish-display" class="cursive-text">A special surprise waiting for you...</div>
        
        <div id="blessing-box" class="blessing-neon">Mahadev Bless You</div>

        <button id="action-btn" class="btn" onclick="stepWish()">Next Surprise ✨</button>
    </div>

    <script>
        // Floating Stars
        const bg = document.getElementById('bg-elements');
        const icons = ['✨', '⭐', '❄️', '💙'];
        for (let i = 0; i < 22; i++) {
            let el = document.createElement('div');
            el.className = 'element';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.fontSize = (Math.random() * 18 + 14) + 'px';
            el.style.animationDuration = (Math.random() * 4 + 5) + 's';
            bg.appendChild(el);
        }

        const audio = document.getElementById('bg-audio');
        let uploadedPhotoUrls = [];
        let finalAudioUrl = "https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=happy-birthday-to-you-piano-124037.mp3";
        let cardData = null;
        let curIdx = 0;

        // Auto Upload to free direct web host
        async function uploadToCloud(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('https://tmpfiles.org/api/v1/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data && data.data && data.data.url) {
                    return data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                }
            } catch(e) {}
            return null;
        }

        async function uploadMultipleImages(input) {
            if (input.files && input.files.length > 0) {
                const status = document.getElementById('photo-status');
                const btn = document.getElementById('gen-btn');
                status.innerText = `Uploading ${input.files.length} photo(s)... ⏳`;
                btn.disabled = true;

                uploadedPhotoUrls = [];
                for (let i = 0; i < input.files.length; i++) {
                    const url = await uploadToCloud(input.files[i]);
                    if (url) uploadedPhotoUrls.push(url);
                }

                if (uploadedPhotoUrls.length > 0) {
                    status.innerText = `✓ ${uploadedPhotoUrls.length} photo(s) uploaded successfully!`;
                } else {
                    // Fallback to placeholder if offline
                    uploadedPhotoUrls = ["https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600"];
                    status.innerText = `✓ Photos ready!`;
                }
                btn.disabled = false;
            }
        }

        async function uploadAudio(input) {
            if (input.files && input.files[0]) {
                const status = document.getElementById('audio-status');
                const btn = document.getElementById('gen-btn');
                status.innerText = "Uploading audio... ⏳";
                btn.disabled = true;

                const url = await uploadToCloud(input.files[0]);
                if (url) {
                    finalAudioUrl = url;
                    status.innerText = "✓ Custom song ready!";
                } else {
                    status.innerText = "✓ Default celebration song ready!";
                }
                btn.disabled = false;
            }
        }

        window.onload = function() {
            document.getElementById('in-wishes').value = 
                "Wishing you a day filled with happiness and a year filled with joy! ✨\n" +
                "May your life be as bright and beautiful as the sky today. 🌟\n" +
                "Wishing you a sky full of stars and a life full of dreams. 🥂\n" +
                "Keep shining and spreading your light wherever you go. 🎈";

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('in-date').value = tomorrow.toISOString().split('T')[0];

            // If scanned via QR Code (URL Query String)
            const urlParams = new URLSearchParams(window.location.search);
            const encoded = urlParams.get('wish');
            if (encoded) {
                try {
                    cardData = JSON.parse(decodeURIComponent(escape(atob(encoded))));
                    document.getElementById('creator-view').style.display = "none";
                    document.getElementById('entry-modal').style.display = "flex";
                } catch(e) {}
            }
        };

        function makeUniversalQR() {
            const name = document.getElementById('in-name').value.trim() || "Special Friend";
            const date = document.getElementById('in-date').value || "";
            const rawWishes = document.getElementById('in-wishes').value.split('\n').filter(w => w.trim() !== "");

            if (uploadedPhotoUrls.length === 0) {
                uploadedPhotoUrls = ["https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600"];
            }

            cardData = {
                n: name,
                d: date,
                p: uploadedPhotoUrls,
                a: finalAudioUrl,
                w: rawWishes
            };

            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(cardData))));
            
            // Clean absolute link with query param (?wish=...)
            const targetUrl = window.location.origin + window.location.pathname + "?wish=" + encoded;

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: targetUrl,
                width: 175,
                height: 175,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
            document.getElementById('qr-result').style.display = "block";
        }

        function testCardLocally() {
            document.getElementById('creator-view').style.display = "none";
            document.getElementById('entry-modal').style.display = "flex";
        }

        function unlockAndPlay() {
            document.getElementById('entry-modal').style.display = "none";
            document.getElementById('card-view').style.display = "block";

            document.getElementById('out-name').innerText = "Happy Birthday, " + cardData.n + "! 🎂";
            
            // Audio setup
            audio.src = cardData.a;
            audio.play().catch(e => console.log(e));

            // Initial photo
            const photoEl = document.getElementById('out-photo');
            photoEl.src = (cardData.p && cardData.p.length > 0) ? cardData.p[0] : "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600";

            initCountdown(cardData.d);
        }

        function initCountdown(dateStr) {
            if (!dateStr) {
                document.getElementById('countdown').style.display = "none";
                return;
            }
            const targetTime = new Date(dateStr + "T00:00:00").getTime();

            function update() {
                const diff = targetTime - new Date().getTime();
                if (diff <= 0) {
                    document.getElementById('countdown').innerHTML = "<h3 style='color:#80d8ff;margin:5px;'>It's Celebration Day! 🥳</h3>";
                    return;
                }
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                document.getElementById('minutes').innerText = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
                document.getElementById('seconds').innerText = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
            }
            update();
            setInterval(update, 1000);
        }

        function stepWish() {
            confetti({
                particleCount: 85,
                spread: 65,
                origin: { y: 0.65 },
                colors: ['#00b0ff', '#ffffff', '#ffd700', '#81d4fa']
            });

            const textEl = document.getElementById('wish-display');
            const btn = document.getElementById('action-btn');
            const blessing = document.getElementById('blessing-box');
            const photoEl = document.getElementById('out-photo');

            if (curIdx < cardData.w.length) {
                textEl.innerText = cardData.w[curIdx];
                btn.innerText = "Next Surprise ✨";

                // Change photo with each wish click
                if (cardData.p && cardData.p.length > 0) {
                    const nextPhotoIdx = (curIdx + 1) % cardData.p.length;
                    photoEl.style.opacity = 0;
                    photoEl.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        photoEl.src = cardData.p[nextPhotoIdx];
                        photoEl.style.opacity = 1;
                        photoEl.style.transform = 'scale(1)';
                    }, 200);
                }

                curIdx++;
            } else {
                textEl.style.display = "none";
                btn.style.display = "none";
                blessing.style.display = "block";

                var duration = 4 * 1000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00b0ff', '#ffffff'] });
                    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00b0ff', '#ffd700'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }
    </script>
</body>
</html>
