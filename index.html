<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Priyanshu & Priyal ✨</title>
    
    <!-- Fonts & Confetti -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease; }
        
        /* 6 Rich Dynamic Aesthetic Themes */
        body.theme-skyblue {
            background: radial-gradient(circle at center, #0d1b2a 0%, #000814 100%);
            --accent: #00b0ff;
            --accent-glow: rgba(0, 176, 255, 0.45);
            --text-glow: #80d8ff;
        }
        body.theme-purple {
            background: radial-gradient(circle at center, #240046 0%, #10002b 100%);
            --accent: #b5179e;
            --accent-glow: rgba(181, 23, 158, 0.45);
            --text-glow: #e0aaff;
        }
        body.theme-rose {
            background: radial-gradient(circle at center, #3d001e 0%, #1a000d 100%);
            --accent: #ff4d6d;
            --accent-glow: rgba(255, 77, 109, 0.45);
            --text-glow: #ffb3c1;
        }
        body.theme-emerald {
            background: radial-gradient(circle at center, #002b28 0%, #001210 100%);
            --accent: #00f5d4;
            --accent-glow: rgba(0, 245, 212, 0.45);
            --text-glow: #70e000;
        }
        body.theme-gold {
            background: radial-gradient(circle at center, #2b1f00 0%, #120c00 100%);
            --accent: #ffd166;
            --accent-glow: rgba(255, 209, 102, 0.45);
            --text-glow: #ffe494;
        }
        body.theme-cyber {
            background: radial-gradient(circle at center, #1b003a 0%, #050014 100%);
            --accent: #7209b7;
            --accent-glow: rgba(114, 9, 183, 0.45);
            --text-glow: #4cc9f0;
        }

        body {
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Floating Stars */
        .bg-elements {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .element {
            position: absolute;
            color: var(--accent);
            opacity: 0.6;
            animation: floatBG 8s infinite ease-in-out;
        }
        @keyframes floatBG {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* UI Theme Selector Ribbon */
        .theme-selector {
            position: fixed;
            top: 15px;
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            z-index: 99;
            backdrop-filter: blur(10px);
        }
        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: 0.2s transform;
        }
        .theme-dot:active { transform: scale(1.25); }

        .box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 26px 20px;
            border-radius: 28px;
            box-shadow: 0 0 35px var(--accent-glow);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.16);
            position: relative;
            z-index: 10;
            margin-top: 35px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--text-glow);
            margin: 5px 0 15px 0;
            font-size: 2.3rem;
            text-shadow: 0 0 15px var(--accent);
        }

        .photo-card {
            background: #ffffff;
            padding: 8px 8px 24px 8px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            margin: 15px auto;
            max-width: 250px;
            transform: rotate(-2deg);
        }
        .photo-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .cursive-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.75rem;
            min-height: 90px;
            line-height: 1.35;
            color: #ffffff;
            margin: 18px 0;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), #014f86);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        /* Strictly No Emojis Neon Blessing */
        .blessing-neon {
            font-family: 'Dancing Script', cursive;
            font-size: 2.4rem;
            color: #ffffff;
            display: none;
            text-shadow: 
                0 0 7px #fff, 
                0 0 15px var(--accent), 
                0 0 35px var(--accent), 
                0 0 70px var(--accent);
            animation: floatBlessing 2.5s infinite ease-in-out;
            margin: 25px 0 15px 0;
        }
        @keyframes floatBlessing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Sound Enable Entry Gate */
        #entry-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body class="theme-skyblue">

    <!-- Theme Switcher Dots on Top -->
    <div class="theme-selector">
        <div class="theme-dot" style="background:#00b0ff;" onclick="setTheme('theme-skyblue')" title="Sky Blue"></div>
        <div class="theme-dot" style="background:#b5179e;" onclick="setTheme('theme-purple')" title="Midnight Purple"></div>
        <div class="theme-dot" style="background:#ff4d6d;" onclick="setTheme('theme-rose')" title="Sunset Rose"></div>
        <div class="theme-dot" style="background:#00f5d4;" onclick="setTheme('theme-emerald')" title="Mint Emerald"></div>
        <div class="theme-dot" style="background:#ffd166;" onclick="setTheme('theme-gold')" title="Royal Gold"></div>
        <div class="theme-dot" style="background:#7209b7;" onclick="setTheme('theme-cyber')" title="Cyber Night"></div>
    </div>

    <div class="bg-elements" id="bg-elements"></div>

    <!-- Soft Romantic Background Music -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <!-- Tap to Open Gate -->
    <div id="entry-modal">
        <h1 style="font-size: 2.8rem; margin-bottom: 8px;">Surprise for Priyanshu & Priyal ✨</h1>
        <p style="color: var(--text-glow); font-size: 1rem; margin-bottom: 25px;">Turn on volume for the romantic melody 🎶</p>
        <button class="btn" style="font-size: 1.2rem; padding: 14px 42px;" onclick="unlockSurprise()">Open Surprise 🎁</button>
    </div>

    <!-- The Birthday Card View -->
    <div class="box" id="card-box" style="display: none;">
        <h1>Happy Birthday! 🎂</h1>
        <p style="font-size: 0.95rem; color: var(--text-glow); margin-top: -10px; font-weight:600;">Priyanshu & Priyal ✨</p>

        <!-- Polaroid Photo -->
        <div class="photo-card">
            <!-- Directly linked to the ImgBB uploaded image -->
            <img id="out-photo" src="https://i.ibb.co/PzrLbCRg/photo.jpg" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600'" alt="Priyanshu & Priyal">
        </div>

        <div id="wish-display" class="cursive-text">A timeless melody of love, laughter, and beautiful memories...</div>
        
        <!-- Strictly No Emojis Neon Blessing -->
        <div id="blessing-box" class="blessing-neon">Mahadev Bless You</div>

        <button id="action-btn" class="btn" onclick="nextSurprise()">Next Surprise ✨</button>
    </div>

    <script>
        // Floating Stars & Hearts
        const bg = document.getElementById('bg-elements');
        const icons = ['✨', '⭐', '❄️', '💙', '💜', '🌸'];
        for (let i = 0; i < 24; i++) {
            let el = document.createElement('div');
            el.className = 'element';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.fontSize = (Math.random() * 18 + 14) + 'px';
            el.style.animationDuration = (Math.random() * 4 + 5) + 's';
            bg.appendChild(el);
        }

        const audio = document.getElementById('bg-audio');
        let curIdx = 0;

        // Custom Curated Romantic English Wishes for Priyanshu & Priyal
        const wishes = [
            "May your bond continue to bloom with unconditional love, warmth, and quiet moments of magic. ✨",
            "Wishing Priyanshu & Priyal a lifetime of shared dreams, laughter that never fades, and endless adventures together. 🌟",
            "May today mark the beginning of a chapter filled with peace, boundless joy, and gentle grace. 🥂",
            "Two souls woven with love, shining brighter than the stars in the night sky. Happy Birthday! 🎈"
        ];

        function setTheme(themeName) {
            document.body.className = themeName;
        }

        function unlockSurprise() {
            document.getElementById('entry-modal').style.display = 'none';
            document.getElementById('card-box').style.display = 'block';
            audio.play().catch(e => console.log(e));

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00b0ff', '#ffffff', '#ffd166', '#ff4d6d']
            });
        }

        function nextSurprise() {
            confetti({
                particleCount: 85,
                spread: 65,
                origin: { y: 0.65 },
                colors: ['#00b0ff', '#ffffff', '#ffd700', '#b5179e']
            });

            const textEl = document.getElementById('wish-display');
            const btn = document.getElementById('action-btn');
            const blessing = document.getElementById('blessing-box');

            if (curIdx < wishes.length) {
                textEl.innerText = wishes[curIdx];
                btn.innerText = "Next Surprise ✨";
                curIdx++;
            } else {
                textEl.style.display = "none";
                btn.style.display = "none";
                blessing.style.display = "block";

                // Grand Final Confetti Blast
                var duration = 4 * 1000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00b0ff', '#ffffff'] });
                    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00b0ff', '#ffd700'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }
    </script>
</body>
</html>
